# Levanta un contenedor de addons apuntando a un git worktree de .trees/, en
# paralelo al lkf-addons del arbol principal.
#
#   cd <tu-clon-de-addons>/docker
#   ADDONS=$(git rev-parse --show-toplevel) WT=<nombre-worktree> \
#     docker compose -f docker-compose.worktree.yml up -d
#   docker exec -it lkf-addons-<nombre-worktree> bash
#
# Para tirarlo: mismo comando con `down` en lugar de `up -d`.
#
# Por que no se corre el docker-compose.yml normal desde .trees/<n>/docker:
# ese archivo usa rutas relativas `../../`, que desde el worktree resuelven a
# .trees/linkaform_api y .trees/lkf -- no existen, Docker crea directorios
# vacios y tapa el linkaform_api instalado en site-packages.

name: lkf-wt

networks:
  linkaform:
    name: linkaform
    external: true

services:
  lkf-addons-wt:
    restart: "no"
    container_name: lkf-addons-${WT}
    hostname: lkf-addons
    image: linkaform/addons:develop
    networks:
      linkaform:
    ports:
      # 5001 lo tiene el contenedor del arbol principal.
      - "${WT_PORT:-5002}:5000"
    volumes:
      # --- del WORKTREE: el codigo que se esta probando ---
      - ${ADDONS}/.trees/${WT}/lkf_addons:/usr/local/lib/python3.10/site-packages/lkf_addons/
      - ${ADDONS}/.trees/${WT}/lkf_addons/bin/lkfaddons.py:/usr/local/bin/lkfaddons.py
      - ${ADDONS}/.trees/${WT}/lkf_addons/bin/download_module.py:/usr/local/bin/download_module.py
      - ${ADDONS}/.trees/${WT}/lkf_addons/bin/json_xml.py:/usr/local/bin/json_xml.py
      - ${ADDONS}/.trees/${WT}/lkf_addons/bin/xml_2_json.py:/usr/local/bin/xml_2_json.py
      - ${ADDONS}/.trees/${WT}/modules:/srv/scripts/addons/modules
      - ${ADDONS}/.trees/${WT}/config:/srv/scripts/addons/config
      # --- del arbol PRINCIPAL: estado local que no se versiona ---
      # local_settings.py y secrets/ estan en .gitignore, asi que el worktree
      # nace sin ellos: se toman prestados del clon principal.
      - ${ADDONS}/config/local_settings.py:/srv/scripts/addons/config/local_settings.py
      - ${ADDONS}/secrets:/srv/scripts/addons/secrets
      - ${ADDONS}/secrets/lkf_jwt_key.pub:/etc/ssl/certs/lkf_jwt_key.pub
      # LKF_API es la misma variable que resuelve lib/lkf_workspace.py en el
      # plugin lkf-claude. El default es el layout viejo (~/lkf).
      - ${LKF_API:-${HOME}/lkf/linkaform_api}/linkaform_api:/usr/local/lib/python3.10/site-packages/linkaform_api/
      # El repo `lkf` (infosync_scripts) no esta como submodulo. Si lo tienes,
      # descomenta y apunta LKF_INFOSYNC a su ruta:
      # - ${LKF_INFOSYNC}/infosync_scripts/:/srv/infosync_scripts
      - ${HOME}/.bash_lkf_history:/srv/scripts/.bash_history
    command: sleep infinity
    stdin_open: true
    tty: true
