name: Test - Accesos (preprod)

# Corre solo las pruebas del feature de "accesos" que realmente se vio afectado
# por el cambio, en vez de correr todas las pruebas del módulo en cada push.
#
# El job "detect" revisa qué funciones de app.py cambiaron. Solo cuentan las
# funciones que tienen un tag explícito en el comentario justo arriba del
# "def", ej:
#
#   # feature: pases
#   def create_access_pass(self, access_pass):
#
# Si la función no tiene tag, se ignora -- no hay fallback por nombre. Para
# que una función dispare su feature, hay que etiquetarla explícitamente.
#
# Limitación conocida: si un push solo modifica un archivo de test (sin
# tocar app.py), no se detecta nada y no corre ningún feature. test/sdk_testing
# es un submódulo, así que desde este repo no se puede ver qué archivo cambió
# dentro de él, solo que el submódulo avanzó de commit. Validar tests nuevos
# localmente (contenedor) antes de subir.
#
# Para agregar un feature nuevo: etiquetar sus funciones en app.py con
# "# feature: <nombre>", agregar el nombre a la lista de tags conocidos en el
# script del job "detect", y agregar el job de integración correspondiente,
# siguiendo el mismo patrón que "integration-pases-entrada".
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      run_pases: ${{ steps.detect.outputs.run_pases }}
      run_update_pases: ${{ steps.detect.outputs.run_update_pases }}
    steps:
      - name: Checkout addons
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar features afectados
        id: detect
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          FILE="lkf_addons/addons/accesos/app.py"

          # Corridas manuales, o el primer commit del repo (sin base SHA
          # utilizable): corremos todo por seguridad.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ -z "$BASE_SHA" ] || \
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No hay base SHA usable, corriendo todos los features."
            echo "run_pases=true" >> "$GITHUB_OUTPUT"
            echo "run_update_pases=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_LINES=$(git diff --unified=0 "$BASE_SHA" HEAD -- "$FILE" \
            | grep -E '^@@' \
            | sed -E 's/^@@ -[0-9]+(,[0-9]+)? \+([0-9]+)(,[0-9]+)? @@.*/\2/')

          RUN_PASES=false
          RUN_UPDATE_PASES=false
          for LINE in $CHANGED_LINES; do
            # Ubica el "def" más cercano hacia arriba desde la línea que
            # cambió, y devuelve "numero_de_linea:nombre_funcion".
            HIT=$(awk -v target="$LINE" '
              NR <= target && $0 ~ /^[[:space:]]*def [A-Za-z_][A-Za-z0-9_]*\(/ { defline=NR; line=$0 }
              END {
                if (line != "") {
                  sub(/^[[:space:]]*def /, "", line)
                  sub(/\(.*/, "", line)
                  print defline ":" line
                }
              }
            ' "$FILE")
            [ -z "$HIT" ] && continue

            DEFLINE="${HIT%%:*}"
            FN="${HIT#*:}"
            echo "Función modificada en app.py: $FN (línea $DEFLINE)"

            # Tag explícito: "# feature: <nombre>" justo arriba del def.
            # Sin tag, la función se ignora.
            TAG_LINE=$(sed -n "$((DEFLINE - 1))p" "$FILE")
            TAG=$(echo "$TAG_LINE" | sed -nE 's/^[[:space:]]*#[[:space:]]*feature:[[:space:]]*([A-Za-z0-9_]+).*/\1/p')

            if [ -z "$TAG" ]; then
              echo "  -> sin tag, se ignora"
              continue
            fi

            echo "  -> tag encontrado: $TAG"
            if [ "$TAG" = "pases" ]; then
              RUN_PASES=true
            fi
            if [ "$TAG" = "update_pases" ]; then
              RUN_UPDATE_PASES=true
            fi
          done

          echo "run_pases=$RUN_PASES"
          echo "run_pases=$RUN_PASES" >> "$GITHUB_OUTPUT"
          echo "run_update_pases=$RUN_UPDATE_PASES"
          echo "run_update_pases=$RUN_UPDATE_PASES" >> "$GITHUB_OUTPUT"

  integration-pases-entrada:
    needs: detect
    if: needs.detect.outputs.run_pases == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar acceso SSH al submódulo sdk_testing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SDK_TESTING_DEPLOY_KEY }}

      - name: Checkout addons (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Generar config/local_settings.py desde secrets
        run: |
          cat > config/local_settings.py <<EOF
          # coding: utf-8
          from settings import *
          from uts import update_settings

          config.update({
              'USERNAME': '${{ secrets.PREPROD_USERNAME }}',
              'APIKEY': '${{ secrets.PREPROD_APIKEY }}',
              'ACCOUNT_ID': '${{ secrets.PREPROD_ACCOUNT_ID }}',
          })

          settings.config.update(config)
          settings = update_settings(settings)
          EOF

      - name: Apuntar entorno a preprod
        run: |
          sed -i "s/^ENV = 'prod'/# ENV = 'prod'/; s/^# ENV = 'preprod'/ENV = 'preprod'/" config/enviorment.py
          grep "^ENV" config/enviorment.py

      - name: Construir imagen de test
        run: docker build -f test/docker/Dockerfile --target develop -t linkaform/lkf_test:develop test/docker

      - name: Correr tests de integración (create_access_pass)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/secrets/lkf_jwt_key.pub:/etc/ssl/certs/lkf_jwt_key.pub" \
            -v "${{ github.workspace }}/lkf_addons:/usr/local/lib/python3.10/site-packages/lkf_addons" \
            -v "${{ github.workspace }}/modules:/usr/local/lib/python3.10/site-packages/lkf_modules" \
            -v "${{ github.workspace }}/test:/srv/lkf_test" \
            -v "${{ github.workspace }}/config:/srv/scripts/addons/config" \
            -w /srv/lkf_test \
            linkaform/lkf_test:develop \
            pytest sdk_testing/accesos/passes/integration/test_create_access_pass_api.py -v

  integration-pases-update:
    needs: detect
    if: needs.detect.outputs.run_update_pases == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configurar acceso SSH al submódulo sdk_testing
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SDK_TESTING_DEPLOY_KEY }}
 
      - name: Checkout addons (con submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive
 
      - name: Generar config/local_settings.py desde secrets
        run: |
          cat > config/local_settings.py <<EOF
          # coding: utf-8
          from settings import *
          from uts import update_settings
 
          config.update({
              'USERNAME': '${{ secrets.PREPROD_USERNAME }}',
              'APIKEY': '${{ secrets.PREPROD_APIKEY }}',
              'ACCOUNT_ID': '${{ secrets.PREPROD_ACCOUNT_ID }}',
          })
 
          settings.config.update(config)
          settings = update_settings(settings)
          EOF
 
      - name: Apuntar entorno a prod
        run: |
          sed -i "s/^# ENV = 'prod'/ENV = 'prod'/; s/^ENV = 'preprod'/# ENV = 'preprod'/" config/enviorment.py
          grep "^ENV" config/enviorment.py

      - name: Construir imagen de test
        run: docker build -f test/docker/Dockerfile --target develop -t linkaform/lkf_test:develop test/docker

      - name: Correr tests de integración (update_full_pass)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/secrets/lkf_jwt_key.pub:/etc/ssl/certs/lkf_jwt_key.pub" \
            -v "${{ github.workspace }}/lkf_addons:/usr/local/lib/python3.10/site-packages/lkf_addons" \
            -v "${{ github.workspace }}/modules:/usr/local/lib/python3.10/site-packages/lkf_modules" \
            -v "${{ github.workspace }}/test:/srv/lkf_test" \
            -v "${{ github.workspace }}/config:/srv/scripts/addons/config" \
            -w /srv/lkf_test \
            linkaform/lkf_test:develop \
            pytest sdk_testing/accesos/passes/integration/test_update_full_pass_api.py -v --allow-prod-integration